name: Atlas pipeline

# Runs the tests on every push, then fetches the official sources, rebuilds the
# database, runs the quality checks and publishes the map to GitHub Pages.
# Weekly schedule: the map updates itself without anyone touching it.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"   # Mondays 05:23 UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas
  cancel-in-progress: false

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlas

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: atlas }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Tests with synthetic data (planted errors must be caught)
        run: |
          python -m tests.make_fixtures
          pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: atlas }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run pipeline on live sources (BKG, MaStR)
        env:
          PREVIOUS_META_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/meta.json
        run: python -m pipeline.run
      - name: Keep the check report, also when the run fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-report
          path: downloads/last_checks.json
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
